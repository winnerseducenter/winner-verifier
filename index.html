<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>贏家文教中心 - 搶肉憑證與核銷系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 20px 12px;
    }
    .ticket-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      padding: 28px 22px;
      margin-top: 8px;
      border: 1px solid #e2e8f0;
    }

    /* 頂部狀態 Banner（完美置頂，絕不像按鈕） */
    .top-status-banner {
      border-radius: 14px;
      padding: 14px 16px;
      text-align: center;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .banner-valid {
      background-color: #ecfdf5;
      color: #065f46;
      border: 1.5px solid #a7f3d0;
    }
    .banner-redeemed {
      background-color: #fff1f2;
      color: #9f1239;
      border: 1.5px solid #fecdd3;
    }
    .redeem-time-text {
      display: block;
      font-size: 15px;
      color: #b91c1c;
      margin-top: 4px;
      font-weight: 700;
    }

    .ticket-serial-title {
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .ticket-serial-num {
      font-size: 52px;
      font-weight: 900;
      color: #D97706; /* 三位數暖橘色序號 */
      line-height: 1.1;
      margin-bottom: 22px;
    }

    /* 資訊表格：超大字體 */
    .info-table {
      background-color: #f8fafc;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 24px;
      border: 1px solid #e2e8f0;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px dashed #cbd5e1;
    }
    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }
    .info-label {
      font-size: 17px;
      font-weight: 600;
      color: #64748b;
    }
    .info-value {
      font-size: 21px;
      font-weight: 800;
      color: #0f172a;
      text-align: right;
    }

    /* 老師專用核銷按鈕 (具備絕對按壓識別度) */
    .btn-action-redeem {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 22px;
      font-weight: 900;
      width: 100%;
      box-shadow: 0 8px 22px rgba(220, 38, 38, 0.4);
      cursor: pointer;
    }
    .btn-action-redeem:active {
      transform: scale(0.97);
    }
    .btn-next-scan {
      margin-top: 14px;
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      width: 100%;
    }
    #reader { width: 100%; border-radius: 14px; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 520px;">
    
    <div class="text-center mt-2 mb-3">
      <h3 class="fw-bold text-danger mb-1">🍗 贏家文教中秋搶肉憑證</h3>
      <div id="modeTag" class="badge bg-dark px-3 py-2 fs-6 rounded-pill">學員專屬兌換憑證</div>
    </div>

    <!-- 老師現場相機掃描模式 -->
    <div id="teacherMode" class="d-none">
      <div class="card p-3 mb-3 text-center border-0 shadow-sm">
        <div id="lineBrowserAlert" class="alert alert-warning d-none text-start small">
          ⚠️ <strong>檢測到您正在使用 LINE 內建瀏覽器</strong><br>
          請點擊右上角「`...`」選擇 <strong>「以預設瀏覽器開啟」</strong> 以獲取相機權限。
        </div>
        <div id="reader"></div>
        <button id="restartBtn" class="btn btn-outline-secondary mt-3 d-none" onclick="startScanner()">📷 重新開啟相機</button>
      </div>
    </div>

    <!-- 載入中動畫 -->
    <div id="loading" class="text-center my-5">
      <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status"></div>
      <p class="mt-3 text-secondary fw-bold fs-5">資料讀取中，請稍候...</p>
    </div>

    <!-- 票卡核心區域 -->
    <div id="ticketCard" class="ticket-card text-center d-none">
      
      <!-- 頂部狀態列 -->
      <div id="topStatusBanner" class="top-status-banner banner-valid">
        <span>✅ 憑證有效（尚未領取）</span>
      </div>

      <div class="ticket-serial-title">兌換序號</div>
      <div id="ticketNumber" class="ticket-serial-num">000</div>

      <div class="info-table text-start">
        <div class="info-row">
          <span class="info-label">學生姓名</span>
          <span id="infoName" class="info-value">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">就讀學校</span>
          <span id="infoSchool" class="info-value">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">聯絡電話</span>
          <span id="infoPhone" class="info-value">--</span>
        </div>
      </div>

      <div id="staffActionArea" class="d-none">
        <button id="redeemBtn" class="btn-action-redeem" onclick="doManualVerify()">
          🥩 確認核銷・交付雞胸肉
        </button>
      </div>

      <div id="nextScanArea" class="d-none">
        <button class="btn-next-scan" onclick="location.reload()">
          🔄 繼續掃描下一位同學
        </button>
      </div>
    </div>

    <div id="errorCard" class="text-center my-4 d-none">
      <h5 id="errorText" class="text-danger fw-bold bg-warning p-3 rounded-3 border border-danger"></h5>
    </div>

  </div>

  <script>
    if (window.top !== window.self) {
      window.top.location.href = window.location.href;
    }

    // ==========================================
    // 🔗 請務必填入你目前正式啟用的 GAS Web App 部署網址！
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/你的GAS實際ID/exec"; 

    let html5QrcodeScanner = null;
    let currentHash = "";
    let staffKey = "";

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      currentHash = urlParams.get('hash') || "";
      staffKey = urlParams.get('staff') || "";

      if (staffKey) {
        document.getElementById('modeTag').className = "badge bg-primary px-3 py-2 fs-6 rounded-pill";
        document.getElementById('modeTag').innerText = "👮 贏家工作人員現場核銷機";
      }

      if (!currentHash) {
        const raw = window.location.href;
        const match = raw.match(/[?&]hash=([^&]+)/);
        if (match) currentHash = match[1];
      }

      if (currentHash) {
        document.getElementById('teacherMode').classList.add('d-none');
        fetchTicketData(currentHash);
      } else {
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('teacherMode').classList.remove('d-none');
        checkLineBrowser();
        startScanner();
      }
    };

    function checkLineBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.indexOf("Line") > -1) {
        document.getElementById('lineBrowserAlert').classList.remove('d-none');
      }
    }

    function startScanner() {
      document.getElementById('errorCard').classList.add('d-none');
      document.getElementById('restartBtn').classList.add('d-none');

      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }

      const config = { fps: 10, qrbox: { width: 250, height: 250 } };
      
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          html5QrcodeScanner.stop().then(() => {
            let hash = decodedText;
            if (decodedText.includes('hash=')) {
              const match = decodedText.match(/[?&]hash=([^&]+)/);
              if (match) hash = match[1];
            }
            currentHash = hash;
            fetchTicketData(hash);
          });
        }
      ).catch(err => {
        document.getElementById('loading').classList.add('d-none');
        showError("無法啟動相機！請確認相機權限。");
      });
    }

    function fetchTicketData(hash) {
      document.getElementById('loading').classList.remove('d-none');
      document.getElementById('ticketCard').classList.add('d-none');
      document.getElementById('errorCard').classList.add('d-none');

      // GitHub Pages 透過 JSON API 跨域向 GAS 抓取資料
      const apiUrl = GAS_WEB_APP_URL + "?action=getDetails&hash=" + encodeURIComponent(hash);
      fetch(apiUrl)
        .then(res => res.json())
        .then(data => renderCard(data))
        .catch(err => showError("❌ 網路連線錯誤，請檢查 GAS 部署網址。"));
    }

    function renderCard(data) {
      document.getElementById('loading').classList.add('d-none');

      if (!data || !data.success) {
        showError(data ? data.message : "系統查無此票券資料");
        return;
      }

      document.getElementById('ticketCard').classList.remove('d-none');
      
      // 強制轉為三位數序號 (例如 001)
      let numStr = String(data.ticketNum || "1").replace(/[^0-9]/g, '');
      if (numStr === "") numStr = "1";
      document.getElementById('ticketNumber').innerText = numStr.padStart(3, '0');

      document.getElementById('infoName').innerText = data.name || data.studentName || "未填寫";
      document.getElementById('infoSchool').innerText = data.school || "未填寫";
      document.getElementById('infoPhone').innerText = data.phone || "未填寫";

      const banner = document.getElementById('topStatusBanner');
      const staffArea = document.getElementById('staffActionArea');

      if (data.isRedeemed) {
        banner.className = "top-status-banner banner-redeemed";
        banner.innerHTML = `<div>⚠️ 此票券已於稍早領取！<span class="redeem-time-text">${data.redeemTime}</span></div>`;
        staffArea.classList.add('d-none');
        if (staffKey) document.getElementById('nextScanArea').classList.remove('d-none');
      } else {
        banner.className = "top-status-banner banner-valid";
        banner.innerHTML = `<span>✅ 憑證有效・尚未領取</span>`;
        
        if (staffKey) {
          staffArea.classList.remove('d-none');
        }
      }
    }

    function doManualVerify() {
      if (!confirm("確定要核銷此學生的票券並交付雞胸肉嗎？")) return;

      const btn = document.getElementById('redeemBtn');
      btn.disabled = true;
      btn.innerText = "⏳ 處理中...";

      const url = `${GAS_WEB_APP_URL}?action=redeem&hash=${encodeURIComponent(currentHash)}&staff=${encodeURIComponent(staffKey)}`;
      fetch(url)
        .then(r => r.json())
        .then(res => {
          alert(res.message);
          location.reload();
        })
        .catch(e => {
          alert("核銷請求失敗！");
          btn.disabled = false;
          btn.innerText = "🥩 確認核銷・交付雞胸肉";
        });
    }

    function showError(msg) {
      document.getElementById('loading').classList.add('d-none');
      const errCard = document.getElementById('errorCard');
      errCard.classList.remove('d-none');
      document.getElementById('errorText').innerText = msg;
    }
  </script>
</body>
</html>
